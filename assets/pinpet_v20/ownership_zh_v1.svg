<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110"><rect width="1400" height="1110" rx="28" fill="#edf0e5"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="65" y="70" font-size="23" fill="#76846b" font-weight="400">PINPET / PRODUCT ENGINEERING</text><text x="65" y="145" font-size="47" fill="#234438" font-weight="600">从一个问题，到持续维护的产品</text><text x="65" y="195" font-size="24" fill="#627365" font-weight="400">独立开发工作线路 · 按编号顺序阅读</text><rect x="65" y="250" width="590" height="205" rx="20" fill="#fff"/><text x="95" y="298" font-size="30" fill="#234438" font-weight="600">01 / 定义产品</text><text x="95" y="342" font-size="23" fill="#627365" font-weight="400">梳理用户路径与功能边界</text><text x="95" y="376" font-size="23" fill="#627365" font-weight="400">区分计算评估与实际供餐建议</text><text x="682" y="358" font-size="34" fill="#234438" font-weight="400">→</text><rect x="745" y="250" width="590" height="205" rx="20" fill="#fff"/><text x="775" y="298" font-size="30" fill="#234438" font-weight="600">02 / 整理数据</text><text x="775" y="342" font-size="23" fill="#627365" font-weight="400">把专业资料转为版本化数据表</text><text x="775" y="376" font-size="23" fill="#627365" font-weight="400">保留来源、单位与覆盖状态</text><rect x="65" y="500" width="590" height="205" rx="20" fill="#234c3e"/><text x="95" y="548" font-size="30" fill="#fff" font-weight="600">03 / 构建引擎</text><text x="95" y="592" font-size="23" fill="#d6e2cd" font-weight="400">建立营养、食材及比例约束</text><text x="95" y="626" font-size="23" fill="#d6e2cd" font-weight="400">实现求解、评分与缺口解释</text><text x="682" y="608" font-size="34" fill="#234438" font-weight="400">→</text><rect x="745" y="500" width="590" height="205" rx="20" fill="#fff"/><text x="775" y="548" font-size="30" fill="#234438" font-weight="600">04 / 连接体验</text><text x="775" y="592" font-size="23" fill="#627365" font-weight="400">开发网页、手机 H5 与原生分享</text><text x="775" y="626" font-size="23" fill="#627365" font-weight="400">统一结果、保存与计划链路</text><rect x="65" y="750" width="590" height="205" rx="20" fill="#fff"/><text x="95" y="798" font-size="30" fill="#234438" font-weight="600">05 / 验证系统</text><text x="95" y="842" font-size="23" fill="#627365" font-weight="400">组织引擎、接口及前端测试</text><text x="95" y="876" font-size="23" fill="#627365" font-weight="400">检查异常分支与多端完整路径</text><text x="682" y="858" font-size="34" fill="#234438" font-weight="400">→</text><rect x="745" y="750" width="590" height="205" rx="20" fill="#fff"/><text x="775" y="798" font-size="30" fill="#234438" font-weight="600">06 / 发布维护</text><text x="775" y="842" font-size="23" fill="#627365" font-weight="400">准备发布、备份和回滚流程</text><text x="775" y="876" font-size="23" fill="#627365" font-weight="400">根据反馈定位问题并继续迭代</text><g stroke="#87977d" stroke-width="2" fill="none"><path d="M1040 455 V478 H360 V494 M354 488 L360 494 L366 488 M1040 705 V728 H360 V744 M354 738 L360 744 L366 738"/></g><text x="65" y="1058" font-size="25" fill="#234438" font-weight="400">我的工作范围：产品定义 → 数据 → 算法 → 全栈 → 运维</text></g></svg>