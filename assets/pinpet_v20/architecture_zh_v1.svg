<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110"><rect width="1400" height="1110" rx="28" fill="#edf0e5"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="65" y="70" font-size="23" fill="#76846b" font-weight="400">PINPET / PRODUCT ENGINEERING</text><text x="65" y="145" font-size="47" fill="#234438" font-weight="600">一个计算内核，连接多个使用端</text><text x="65" y="195" font-size="24" fill="#627365" font-weight="400">依据现行代码整理的系统结构示意</text><rect x="65" y="235" width="1270" height="172" rx="20" fill="#fff"/><text x="95" y="283" font-size="30" fill="#234438" font-weight="600">01 / 产品呈现层</text><text x="95" y="327" font-size="23" fill="#627365" font-weight="400">电脑版 · React / TypeScript</text><text x="95" y="361" font-size="23" fill="#627365" font-weight="400">手机 H5 · 微信小程序 WebView 共用业务页面</text><text x="95" y="395" font-size="23" fill="#627365" font-weight="400">原生小程序 · 登录与制作单分享</text><text x="680" y="429" font-size="26" fill="#839177" font-weight="400">↕</text><rect x="65" y="432" width="1270" height="172" rx="20" fill="#fff"/><text x="95" y="480" font-size="30" fill="#234438" font-weight="600">02 / 服务与契约层</text><text x="95" y="524" font-size="23" fill="#627365" font-weight="400">FastAPI · 请求校验与统一返回结构</text><text x="95" y="558" font-size="23" fill="#627365" font-weight="400">engine_bridge.py · 后端访问引擎的唯一入口</text><text x="95" y="592" font-size="23" fill="#627365" font-weight="400">计算结果 → 保存食谱 → 供餐计划 / 分享快照</text><text x="680" y="626" font-size="26" fill="#839177" font-weight="400">↕</text><rect x="65" y="629" width="1270" height="172" rx="20" fill="#234c3e"/><text x="95" y="677" font-size="30" fill="#fff" font-weight="600">03 / 确定性计算层</text><text x="95" y="721" font-size="23" fill="#d6e2cd" font-weight="400">犬况 → 营养基准 → LP / MILP 约束求解</text><text x="95" y="755" font-size="23" fill="#d6e2cd" font-weight="400">食谱评估 → score_v2 评分 → 缺口与解释</text><text x="95" y="789" font-size="23" fill="#d6e2cd" font-weight="400">营养计算由代码执行，内核不调用 LLM</text><text x="680" y="823" font-size="26" fill="#839177" font-weight="400">↕</text><rect x="65" y="826" width="1270" height="172" rx="20" fill="#fff"/><text x="95" y="874" font-size="30" fill="#234438" font-weight="600">04 / 版本化数据层</text><text x="95" y="918" font-size="23" fill="#627365" font-weight="400">营养标准表 + 食材库 + 补剂库</text><text x="95" y="952" font-size="23" fill="#627365" font-weight="400">保留来源、单位、生命阶段与数据覆盖状态</text><text x="95" y="986" font-size="23" fill="#627365" font-weight="400">区分数据未覆盖与实际营养缺口</text></g></svg>