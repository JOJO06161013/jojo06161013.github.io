<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110"><rect width="1400" height="1110" rx="28" fill="#edf0e5"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="65" y="70" font-size="23" fill="#76846b" font-weight="400">PINPET / PRODUCT ENGINEERING</text><text x="65" y="145" font-size="47" fill="#234438" font-weight="600">From a problem to a maintained product</text><text x="65" y="195" font-size="24" fill="#627365" font-weight="400">End-to-end responsibilities · read in numbered order</text><rect x="65" y="250" width="590" height="205" rx="20" fill="#fff"/><text x="95" y="298" font-size="30" fill="#234438" font-weight="600">01 / Define the product</text><text x="95" y="342" font-size="23" fill="#627365" font-weight="400">Map the user journey and scope</text><text x="95" y="376" font-size="23" fill="#627365" font-weight="400">Separate evaluation from feeding advice</text><text x="682" y="358" font-size="34" fill="#234438" font-weight="400">→</text><rect x="745" y="250" width="590" height="205" rx="20" fill="#fff"/><text x="775" y="298" font-size="30" fill="#234438" font-weight="600">02 / Structure the data</text><text x="775" y="342" font-size="23" fill="#627365" font-weight="400">Translate references into versioned tables</text><text x="775" y="376" font-size="23" fill="#627365" font-weight="400">Keep units, provenance and coverage</text><rect x="65" y="500" width="590" height="205" rx="20" fill="#234c3e"/><text x="95" y="548" font-size="30" fill="#fff" font-weight="600">03 / Build the engine</text><text x="95" y="592" font-size="23" fill="#d6e2cd" font-weight="400">Model nutrition and ingredient constraints</text><text x="95" y="626" font-size="23" fill="#d6e2cd" font-weight="400">Implement optimization and explanations</text><text x="682" y="608" font-size="34" fill="#234438" font-weight="400">→</text><rect x="745" y="500" width="590" height="205" rx="20" fill="#fff"/><text x="775" y="548" font-size="30" fill="#234438" font-weight="600">04 / Connect the experience</text><text x="775" y="592" font-size="23" fill="#627365" font-weight="400">Build web, mobile H5 and native sharing</text><text x="775" y="626" font-size="23" fill="#627365" font-weight="400">Unify results, saved recipes and plans</text><rect x="65" y="750" width="590" height="205" rx="20" fill="#fff"/><text x="95" y="798" font-size="30" fill="#234438" font-weight="600">05 / Verify the system</text><text x="95" y="842" font-size="23" fill="#627365" font-weight="400">Test engine, API and frontend behavior</text><text x="95" y="876" font-size="23" fill="#627365" font-weight="400">Check failures and cross-screen flows</text><text x="682" y="858" font-size="34" fill="#234438" font-weight="400">→</text><rect x="745" y="750" width="590" height="205" rx="20" fill="#fff"/><text x="775" y="798" font-size="30" fill="#234438" font-weight="600">06 / Ship and maintain</text><text x="775" y="842" font-size="23" fill="#627365" font-weight="400">Prepare releases, backups and rollback</text><text x="775" y="876" font-size="23" fill="#627365" font-weight="400">Use feedback to guide the next iteration</text><g stroke="#87977d" stroke-width="2" fill="none"><path d="M1040 455 V478 H360 V494 M354 488 L360 494 L366 488 M1040 705 V728 H360 V744 M354 738 L360 744 L366 738"/></g><text x="65" y="1058" font-size="25" fill="#234438" font-weight="400">My role: product definition → data → algorithms → full stack → operations</text></g></svg>