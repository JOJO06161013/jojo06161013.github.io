<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110"><rect width="1400" height="1110" rx="28" fill="#edf0e5"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="65" y="70" font-size="23" fill="#76846b" font-weight="400">PINPET / PRODUCT ENGINEERING</text><text x="65" y="145" font-size="47" fill="#234438" font-weight="600">One calculation core, multiple interfaces</text><text x="65" y="195" font-size="24" fill="#627365" font-weight="400">Simplified architecture based on the current repository</text><rect x="65" y="235" width="1270" height="172" rx="20" fill="#fff"/><text x="95" y="283" font-size="30" fill="#234438" font-weight="600">01 / Product surfaces</text><text x="95" y="327" font-size="23" fill="#627365" font-weight="400">Desktop web · React / TypeScript</text><text x="95" y="361" font-size="23" fill="#627365" font-weight="400">Mobile H5 · loaded by WeChat WebView</text><text x="95" y="395" font-size="23" fill="#627365" font-weight="400">Native mini-program · login and recipe sharing</text><text x="680" y="429" font-size="26" fill="#839177" font-weight="400">↕</text><rect x="65" y="432" width="1270" height="172" rx="20" fill="#fff"/><text x="95" y="480" font-size="30" fill="#234438" font-weight="600">02 / Service boundary</text><text x="95" y="524" font-size="23" fill="#627365" font-weight="400">FastAPI · validated request / response schemas</text><text x="95" y="558" font-size="23" fill="#627365" font-weight="400">engine_bridge.py · single entry into the calculation engine</text><text x="95" y="592" font-size="23" fill="#627365" font-weight="400">Results → saved recipes → meal plans / share snapshots</text><text x="680" y="626" font-size="26" fill="#839177" font-weight="400">↕</text><rect x="65" y="629" width="1270" height="172" rx="20" fill="#234c3e"/><text x="95" y="677" font-size="30" fill="#fff" font-weight="600">03 / Deterministic engine</text><text x="95" y="721" font-size="23" fill="#d6e2cd" font-weight="400">Dog profile → requirements → LP / MILP optimization</text><text x="95" y="755" font-size="23" fill="#d6e2cd" font-weight="400">Recipe evaluation → score_v2 → gaps and explanations</text><text x="95" y="789" font-size="23" fill="#d6e2cd" font-weight="400">Nutrition calculations run in code; no LLM in the kernel</text><text x="680" y="823" font-size="26" fill="#839177" font-weight="400">↕</text><rect x="65" y="826" width="1270" height="172" rx="20" fill="#fff"/><text x="95" y="874" font-size="30" fill="#234438" font-weight="600">04 / Versioned data</text><text x="95" y="918" font-size="23" fill="#627365" font-weight="400">Nutrient standards + ingredient and supplement tables</text><text x="95" y="952" font-size="23" fill="#627365" font-weight="400">Sources · units · life stages · data coverage</text><text x="95" y="986" font-size="23" fill="#627365" font-weight="400">Missing data remains distinct from a nutrient shortfall</text></g></svg>